<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASR & Computational Linguistics Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #171717;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --border-hover: #3a3a3a;
    --text: #e8e6e0;
    --text-muted: #888;
    --text-dim: #555;
    --accent-classical: #4a9eff;
    --accent-hybrid: #52c97a;
    --accent-e2e: #b87fff;
    --accent-ssl: #ffaa44;
    --accent-indigenous: #ff7a6b;
    --mono: 'DM Mono', monospace;
    --serif: 'Instrument Serif', Georgia, serif;
    --sans: 'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 28px 40px 24px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  .header-left h1 {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 400;
    font-style: italic;
    letter-spacing: -0.3px;
    color: var(--text);
    line-height: 1.2;
  }

  .header-left p {
    margin-top: 4px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: .04em;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .search-wrap {
    position: relative;
  }

  .search-wrap input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 12px 7px 32px;
    width: 200px;
    outline: none;
    transition: border-color .15s;
  }

  .search-wrap input::placeholder { color: var(--text-dim); }
  .search-wrap input:focus { border-color: var(--border-hover); }

  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 13px;
    pointer-events: none;
  }

  .topic-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: calc(100vh - 89px);
  }

  /* ── Sidebar ── */
  .sidebar {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 0;
  }

  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .era-section { border-bottom: 1px solid var(--border); }

  .era-label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px 10px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-dim);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 1;
    border-bottom: 1px solid var(--border);
  }

  .era-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .topic-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    padding: 11px 16px;
    cursor: pointer;
    transition: background .1s;
    position: relative;
  }

  .topic-btn:last-child { border-bottom: none; }
  .topic-btn:hover { background: var(--surface); }

  .topic-btn.active {
    background: var(--surface2);
  }

  .topic-btn.active::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    border-radius: 0 1px 1px 0;
  }

  .topic-btn.hidden { display: none; }

  .btn-title {
    font-size: 13px;
    font-weight: 400;
    color: var(--text);
    line-height: 1.3;
  }

  .btn-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 3px;
  }

  .btn-year {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
  }

  .btn-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .tag {
    font-family: var(--mono);
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    background: var(--surface2);
    color: var(--text-dim);
    letter-spacing: .03em;
  }

  /* ── Detail panel ── */
  .detail {
    overflow-y: auto;
    padding: 36px 44px;
  }

  .detail::-webkit-scrollbar { width: 4px; }
  .detail::-webkit-scrollbar-track { background: transparent; }
  .detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .empty-state {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text-dim);
  }

  .empty-state .em-icon {
    font-size: 32px;
    opacity: .4;
  }

  .empty-state p {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .04em;
  }

  .detail-content { max-width: 680px; }

  .detail-era {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .detail-title {
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 400;
    line-height: 1.15;
    margin-bottom: 4px;
  }

  .detail-year {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 24px;
  }

  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
    margin-top: 28px;
  }

  .detail-desc {
    font-size: 14px;
    line-height: 1.75;
    color: var(--text);
    margin-bottom: 0;
  }

  .lineage-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-muted);
  }

  .resources-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .resource-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    text-decoration: none;
    color: var(--text);
    transition: border-color .15s;
  }

  .resource-item:hover { border-color: var(--border-hover); }

  .resource-type {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .05em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 3px;
    background: var(--surface2);
    color: var(--text-dim);
    flex-shrink: 0;
    margin-top: 1px;
  }

  .resource-title {
    font-size: 13px;
    line-height: 1.4;
  }

  .resource-author {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 1px;
  }

  .notes-area {
    width: 100%;
    min-height: 120px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.65;
    resize: vertical;
    outline: none;
    transition: border-color .15s;
  }

  .notes-area::placeholder { color: var(--text-dim); }
  .notes-area:focus { border-color: var(--border-hover); }

  .notes-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 6px;
  }

  .notes-hint {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
  }

  .save-btn {
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-muted);
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }

  .save-btn:hover { border-color: var(--border-hover); color: var(--text); }
  .save-btn.saved { color: var(--accent-ssl); border-color: var(--accent-ssl); }

  .divider-line {
    height: 1px;
    background: var(--border);
    margin: 32px 0;
  }

  /* ── Era color mapping ── */
  [data-era="classical"] .era-dot,
  [data-era="classical"].topic-btn.active::before { background: var(--accent-classical); }
  [data-era="classical"] .detail-era,
  [data-era="classical"] .section-label { color: var(--accent-classical); }

  [data-era="hybrid"] .era-dot,
  [data-era="hybrid"].topic-btn.active::before { background: var(--accent-hybrid); }
  [data-era="hybrid"] .detail-era,
  [data-era="hybrid"] .section-label { color: var(--accent-hybrid); }

  [data-era="e2e"] .era-dot,
  [data-era="e2e"].topic-btn.active::before { background: var(--accent-e2e); }
  [data-era="e2e"] .detail-era,
  [data-era="e2e"] .section-label { color: var(--accent-e2e); }

  [data-era="ssl"] .era-dot,
  [data-era="ssl"].topic-btn.active::before { background: var(--accent-ssl); }
  [data-era="ssl"] .detail-era,
  [data-era="ssl"] .section-label { color: var(--accent-ssl); }

  [data-era="indigenous"] .era-dot,
  [data-era="indigenous"].topic-btn.active::before { background: var(--accent-indigenous); }
  [data-era="indigenous"] .detail-era,
  [data-era="indigenous"] .section-label { color: var(--accent-indigenous); }

  /* Era label accent colors */
  .era-section[data-era="classical"] .era-label { color: var(--accent-classical); opacity: .8; }
  .era-section[data-era="hybrid"] .era-label { color: var(--accent-hybrid); opacity: .8; }
  .era-section[data-era="e2e"] .era-label { color: var(--accent-e2e); opacity: .8; }
  .era-section[data-era="ssl"] .era-label { color: var(--accent-ssl); opacity: .8; }
  .era-section[data-era="indigenous"] .era-label { color: var(--accent-indigenous); opacity: .8; }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; }
    .sidebar { height: 280px; border-right: none; border-bottom: 1px solid var(--border); }
    .detail { padding: 24px 20px; }
    header { padding: 20px; }
    .header-left h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>ASR &amp; Computational Linguistics</h1>
    <p>personal study roadmap · updated as I learn</p>
  </div>
  <div class="header-right">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="search" placeholder="search topics..." autocomplete="off">
    </div>
    <span class="topic-count" id="count"></span>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="detail" id="detail">
    <div class="empty-state">
      <div class="em-icon">◈</div>
      <p>select a topic to begin</p>
    </div>
  </main>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
//  All content lives in data.json — edit that file, not this one.
//  This script fetches it at load time and builds the UI from it.
// ═══════════════════════════════════════════════════════════════════════

let ERAS = [];
let TOPICS = [];
let activeId = null;

fetch('data.json')
  .then(r => r.json())
  .then(data => {
    ERAS   = data.eras;
    TOPICS = data.topics;
    buildSidebar();
    initSearch();
  })
  .catch(() => {
    document.getElementById('detail').innerHTML =
      '<div class="empty-state"><div class="em-icon">⚠</div><p>could not load data.json</p></div>';
  });

function getAccent(era) {
  const map = {
    classical: 'var(--accent-classical)',
    hybrid:    'var(--accent-hybrid)',
    e2e:       'var(--accent-e2e)',
    ssl:       'var(--accent-ssl)',
    indigenous:'var(--accent-indigenous)',
  };
  return map[era] || 'var(--text-muted)';
}

function getEraName(era) {
  const names = {
    classical:  'Era 1 · Classical',
    hybrid:     'Era 2 · Hybrid',
    e2e:        'Era 3 · End-to-end',
    ssl:        'Era 4 · Self-supervised',
    indigenous: 'Indigenous thread',
  };
  return names[era] || era;
}

function buildSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  ERAS.forEach(era => {
    const section = document.createElement('div');
    section.className = 'era-section';
    section.dataset.era = era.id;

    const label = document.createElement('div');
    label.className = 'era-label';
    label.innerHTML = `<span class="era-dot"></span>${era.label}`;
    section.appendChild(label);

    TOPICS.filter(t => t.era === era.id).forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'topic-btn';
      btn.dataset.era = t.era;
      btn.dataset.id = t.id;
      btn.innerHTML = `
        <div class="btn-title">${t.title}</div>
        <div class="btn-meta">
          <span class="btn-year">${t.year}</span>
          <div class="btn-tags">${(t.tags||[]).map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
        </div>`;
      btn.addEventListener('click', () => selectTopic(t.id));
      section.appendChild(btn);
    });

    sidebar.appendChild(section);
  });
  updateCount(TOPICS.length);
}

function selectTopic(id) {
  const topic = TOPICS.find(t => t.id === id);
  if (!topic) return;
  activeId = id;

  document.querySelectorAll('.topic-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));

  const notes  = localStorage.getItem('notes_' + id) || '';
  const accent = getAccent(topic.era);

  document.getElementById('detail').innerHTML = `
    <div class="detail-content" data-era="${topic.era}">
      <div class="detail-era">
        <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${accent};"></span>
        ${getEraName(topic.era)}
      </div>
      <div class="detail-title">${topic.title}</div>
      <div class="detail-year">${topic.year}</div>

      <div class="section-label" data-era="${topic.era}">Overview</div>
      <div class="detail-desc">${topic.desc.replace(/\n\n/g, '<br><br>')}</div>

      <div class="divider-line"></div>

      <div class="section-label" data-era="${topic.era}">Lineage &amp; connections</div>
      <div class="lineage-box">${topic.lineage}</div>

      ${topic.resources && topic.resources.length > 0 ? `
        <div class="section-label" data-era="${topic.era}" style="margin-top:28px;">Resources</div>
        <div class="resources-list">
          ${topic.resources.map(r => `
            <${r.url ? `a href="${r.url}" target="_blank" rel="noopener"` : 'div'} class="resource-item">
              <span class="resource-type">${r.type}</span>
              <div>
                <div class="resource-title">${r.title}</div>
                ${r.author ? `<div class="resource-author">${r.author}</div>` : ''}
              </div>
            </${r.url ? 'a' : 'div'}>
          `).join('')}
        </div>
      ` : ''}

      <div class="section-label" data-era="${topic.era}" style="margin-top:28px;">My notes</div>
      <textarea class="notes-area" id="notes-${id}" placeholder="Add your own notes, questions, links as you learn...">${notes}</textarea>
      <div class="notes-footer">
        <span class="notes-hint">saved locally in browser</span>
        <button class="save-btn" id="save-btn" onclick="saveNotes('${id}')">save</button>
      </div>
    </div>`;

  document.querySelectorAll(`[data-era="${topic.era}"].section-label`).forEach(el => {
    el.style.color = accent;
  });
  document.querySelector('.detail-era').style.color = accent;

  const ta = document.getElementById('notes-' + id);
  if (ta) ta.addEventListener('input', () => {
    const btn = document.getElementById('save-btn');
    if (btn) btn.classList.remove('saved');
  });
}

function saveNotes(id) {
  const ta = document.getElementById('notes-' + id);
  if (!ta) return;
  localStorage.setItem('notes_' + id, ta.value);
  const btn = document.getElementById('save-btn');
  if (btn) {
    btn.textContent = 'saved ✓';
    btn.classList.add('saved');
    setTimeout(() => { btn.textContent = 'save'; btn.classList.remove('saved'); }, 1800);
  }
}

function updateCount(n) {
  document.getElementById('count').textContent = n + ' topics';
}

function initSearch() {
  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase().trim();
    let visible = 0;
    document.querySelectorAll('.topic-btn').forEach(btn => {
      const topic = TOPICS.find(t => t.id === btn.dataset.id);
      const match = !q ||
        topic.title.toLowerCase().includes(q) ||
        (topic.tags || []).some(tag => tag.includes(q)) ||
        topic.desc.toLowerCase().includes(q) ||
        topic.year.toLowerCase().includes(q);
      btn.classList.toggle('hidden', !match);
      if (match) visible++;
    });
    updateCount(visible);
  });
}
</body>
</html>
